name: "Terraform CI/CD"

on:
  pull_request:
    branches: [main]
    paths:
      - "environments/**"
      - "*.tf"
  push:
    branches: [main]
    paths:
      - "environments/**"
      - "*.tf"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ===========================================================================
  # 1. PLAN PHASE: Concurrently plans Staging & Production on Pull Request
  # ===========================================================================
  terraform-plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials (SA Role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }} # us-east-1
          audience: sts.amazonaws.com

      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=environments/${{ matrix.environment }}/backend.hcl \
            -reconfigure \
            -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=environments/${{ matrix.environment }}/terraform.tfvars \
            -no-color -out=tfplan \
            -input=false \
            && terraform show -no-color tfplan > tfplan.txt

      - name: Publish Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('${{ github.workspace }}/tfplan.txt', 'utf8');
              if (planOutput.length > 60000) {
                planOutput = planOutput.substring(0, 60000) + '\n... [Truncated due to size limit]';
              }
            } catch (err) {
              planOutput = 'Error reading plan output.';
            }

            const comment = `### 📋 Terraform Plan: \`${{ matrix.environment }}\`
            <details><summary>Click to view plan output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} | Branch: \`${{ github.head_ref }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ===========================================================================
  # 2. APPLY STAGING: Applies automatically on Push to Main
  # ===========================================================================
  deploy-staging:
    name: "Apply Staging"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials (SA Role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }} # us-east-1
          audience: sts.amazonaws.com

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=environments/staging/backend.hcl \
            -reconfigure \
            -input=false

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file=environments/staging/terraform.tfvars \
            -auto-approve \
            -input=false

  # ===========================================================================
  # 3. APPLY PRODUCTION: Runs after Staging + Pauses for Manual Approval
  # ===========================================================================
  deploy-production:
    name: "Apply Production"
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # Triggers manual reviewer approval gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Configure AWS Credentials (SA Role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }} # us-east-1
          audience: sts.amazonaws.com

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=environments/production/backend.hcl \
            -reconfigure \
            -input=false

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file=environments/production/terraform.tfvars \
            -auto-approve \
            -input=false
