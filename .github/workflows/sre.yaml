name: "SRE: Health & Monitoring Check"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cloudwatch-health-audit:
    name: "Audit CloudWatch Alarms & System Health"
    runs-on: ubuntu-latest
    environment: production  # Authorizes the runner using the Production OIDC role

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify Assumed Identity
        run: aws sts get-caller-identity

      - name: Check CloudWatch Alarms in ALARM State
        run: |
          echo "=== Querying Active Alarms in ALARM State (${{ vars.AWS_REGION }}) ==="
          ALARMS=$(aws cloudwatch describe-alarms \
            --state-value ALARM \
            --query 'MetricAlarms[*].[AlarmName,MetricName,Namespace,StateUpdatedTimestamp]' \
            --output table)
          
          echo "$ALARMS"
          
          COUNT=$(aws cloudwatch describe-alarms --state-value ALARM --query 'length(MetricAlarms)')
          echo "Total active alarms: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            echo "::warning title=Active Alarms Detected::There are $COUNT alarms currently triggered in ${{ vars.AWS_REGION }}."
          fi

      - name: Query Recent System Log Groups
        run: |
          echo "Checking CloudWatch Log Groups status in ${{ vars.AWS_REGION }}..."
          aws logs describe-log-groups --limit 10 \
            --query 'logGroups[*].[logGroupName,storedBytes]' --output table
