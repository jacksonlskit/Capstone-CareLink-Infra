name: Verify All AWS OIDC Roles

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-sa-role:
    name: 1. Verify SA Role
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assume SA Role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Validate Identity
        run: |
          echo "=== SA Role Assumed Successfully ==="
          aws sts get-caller-identity

  test-sre-role:
    name: 2. Verify SRE Role
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assume SRE Role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SRE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Validate Identity
        run: |
          echo "=== SRE Role Assumed Successfully ==="
          aws sts get-caller-identity

  test-devops-role:
    name: 3. Verify DevOps Role
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assume DevOps Role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEVOPS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Validate Identity
        run: |
          echo "=== DevOps Role Assumed Successfully ==="
          aws sts get-caller-identity
